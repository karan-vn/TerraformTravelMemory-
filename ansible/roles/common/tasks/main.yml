---
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline security and administration packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unzip
    state: present

- name: Disable SSH root login and password authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-travelmemory-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  notify: Restart SSH

- name: Set default incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow operator SSH to the web server
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ operator_cidr }}"
  when: inventory_hostname in groups['web']

- name: Allow public HTTP to the web server
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: inventory_hostname in groups['web']

- name: Allow bastion SSH to the database server
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ public_subnet_cidr }}"
  when: inventory_hostname in groups['database']

- name: Allow MongoDB from the web server
  community.general.ufw:
    rule: allow
    port: "27017"
    proto: tcp
    src: "{{ hostvars[groups['web'][0]].private_ip }}"
  when: inventory_hostname in groups['database']

- name: Enable UFW
  community.general.ufw:
    state: enabled
